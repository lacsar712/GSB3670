version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: harmony_health_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-harmony_health}
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - harmony_network

  backend:
    build: ./backend
    container_name: harmony_health_backend
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-harmony_health}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - harmony_network

  frontend:
    build: ./frontend
    container_name: harmony_health_frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - harmony_network

networks:
  harmony_network:
    driver: bridge

volumes:
  db_data:
